[project]
name = "gambling-host-tracker"
version = "0.1.0"
description = "Collects publicly published payment account numbers from gambling sites for AML blocklisting"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]
export = ["openpyxl>=3.1", "reportlab>=4.0"]
sched = ["apscheduler>=3.10"]
pg = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.4", "pypdf>=4.0"]

[project.scripts]
ght = "ght.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ght.api" = ["templates/*.html", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# FastAPI's documented idiom is to call Depends() in parameter defaults, same as Typer's.
"src/ght/api/**" = ["B008"]
# Typer's documented idiom is to call Option()/Argument() in parameter defaults.
"src/ght/cli.py" = ["B008"]
