<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if auto_refresh %}<meta http-equiv="refresh" content="3">{% endif %}
  <title>{% block title %}Host Tracker{% endblock %}</title>
  <style>
    /* Self-contained by design: this runs on analyst machines that may be offline, and a
       portal over evidence should not reach out to a CDN on every page load. */
    :root {
      --bg:#0d1117; --surface:#161b22; --surface-2:#1c2330; --raise:#212a38;
      --border:#283040; --border-strong:#3a4658;
      --text:#e6edf5; --dim:#9aa7b8; --mute:#6b7788;
      --accent:#4c9ffe; --accent-weak:rgba(76,159,254,.14);
      --ok:#3fb950; --ok-bg:rgba(63,185,80,.14); --ok-bd:rgba(63,185,80,.35);
      --warn:#d6a238; --warn-bg:rgba(214,162,56,.15); --warn-bd:rgba(214,162,56,.38);
      --bad:#f85149; --bad-bg:rgba(248,81,73,.14); --bad-bd:rgba(248,81,73,.38);
      --ch-bkash:#ff4d94; --ch-nagad:#ff8a4c; --ch-rocket:#b57bff;
      --ch-upay:#2bb9aa; --ch-bank:#5aa2ff; --ch-neutral:#8b98ad;
      --radius:12px; --radius-sm:8px;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px -8px rgba(0,0,0,.45);
      --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,ui-sans-serif,sans-serif;
      --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
    }
    * { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family:var(--font); font-size:14px; line-height:1.55;
      -webkit-font-smoothing:antialiased;
    }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    h1 { font-size:22px; font-weight:650; letter-spacing:-.01em; margin:0; }
    h2 { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.07em;
         color:var(--dim); margin:0; }

    /* ---- top bar ---------------------------------------------------------- */
    .topbar {
      position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:8px;
      padding:0 20px; height:56px; background:rgba(13,17,23,.85);
      backdrop-filter:saturate(140%) blur(8px); border-bottom:1px solid var(--border);
    }
    .brand { display:flex; align-items:center; gap:9px; font-weight:650; letter-spacing:-.01em;
             margin-right:14px; white-space:nowrap; }
    .brand .dot { width:9px; height:9px; border-radius:50%;
                  background:var(--accent); box-shadow:0 0 0 4px var(--accent-weak); }
    .nav { display:flex; gap:2px; }
    .nav a { color:var(--dim); padding:7px 12px; border-radius:var(--radius-sm);
             font-weight:500; }
    .nav a:hover { color:var(--text); background:var(--surface-2); text-decoration:none; }
    .nav a.on { color:var(--text); background:var(--surface-2); }
    .topbar .spacer { flex:1; }
    .run-flag { display:inline-flex; align-items:center; gap:7px; font-size:12.5px;
                color:var(--warn); padding:6px 11px; border-radius:999px;
                background:var(--warn-bg); border:1px solid var(--warn-bd); }
    .run-flag .pulse { width:8px; height:8px; border-radius:50%; background:var(--warn);
                       animation:pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.35;} 50%{opacity:1;} }

    /* ---- layout ----------------------------------------------------------- */
    main { max-width:1180px; margin:0 auto; padding:26px 20px 60px; }
    .head { display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:4px; }
    .head .actions { margin-left:auto; display:flex; gap:8px; align-items:center; }
    .sub { color:var(--dim); margin:2px 0 22px; }
    .section { display:flex; align-items:center; gap:9px; margin:30px 0 12px; }
    .section .count { font-size:12px; color:var(--dim); background:var(--surface-2);
                      border:1px solid var(--border); border-radius:999px; padding:1px 9px; }

    /* ---- stat cards ------------------------------------------------------- */
    .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
    .stat { display:block; background:var(--surface); border:1px solid var(--border);
            border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); }
    a.stat:hover { border-color:var(--border-strong); text-decoration:none;
                   transform:translateY(-1px); transition:.12s; }
    .stat-n { font-size:30px; font-weight:680; letter-spacing:-.02em; line-height:1.1; }
    .stat-k { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.05em;
              margin-top:3px; }
    .stat.accent .stat-n { color:var(--accent); }
    .stat.warn .stat-n { color:var(--warn); }

    /* ---- panels & tables -------------------------------------------------- */
    .panel { background:var(--surface); border:1px solid var(--border);
             border-radius:var(--radius); box-shadow:var(--shadow); }
    .table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius);
                  background:var(--surface); box-shadow:var(--shadow); }
    table { width:100%; border-collapse:collapse; white-space:nowrap; }
    thead th { background:var(--surface);
               color:var(--mute); font-size:11px; font-weight:600; text-transform:uppercase;
               letter-spacing:.06em; text-align:left; padding:11px 14px;
               border-bottom:1px solid var(--border); }
    th.num, td.num { text-align:right; font-variant-numeric:tabular-nums; }
    tbody td { padding:11px 14px; border-bottom:1px solid var(--border); }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr:hover { background:var(--surface-2); }
    .mono { font-family:var(--mono); font-size:12.5px; }
    .dim { color:var(--dim); }
    .mute { color:var(--mute); }

    /* ---- tags / badges ---------------------------------------------------- */
    .tag { display:inline-block; padding:1px 9px; border-radius:999px; font-size:11.5px;
           font-weight:550; line-height:1.7; white-space:nowrap; border:1px solid transparent; }
    .tag-neutral { color:var(--dim); background:var(--surface-2); border-color:var(--border); }
    .tag-ok { color:var(--ok); background:var(--ok-bg); border-color:var(--ok-bd); }
    .tag-warn { color:var(--warn); background:var(--warn-bg); border-color:var(--warn-bd); }
    .tag-bad { color:var(--bad); background:var(--bad-bg); border-color:var(--bad-bd); }
    .badge { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
             padding:2px 10px 2px 8px; border-radius:999px; background:var(--surface-2);
             border:1px solid var(--border); }
    .badge::before { content:""; width:7px; height:7px; border-radius:50%;
                     background:var(--ch, var(--ch-neutral)); }
    .ch-bkash{--ch:var(--ch-bkash);} .ch-nagad{--ch:var(--ch-nagad);}
    .ch-rocket{--ch:var(--ch-rocket);} .ch-upay{--ch:var(--ch-upay);}
    .ch-bank_transfer{--ch:var(--ch-bank);} .ch-tap{--ch:var(--ch-neutral);}
    .ch-mcash{--ch:var(--ch-neutral);}

    /* ---- forms / buttons -------------------------------------------------- */
    .toolbar { display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
    input, select, button, .btn {
      font:inherit; color:var(--text); background:var(--surface-2);
      border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 11px;
      height:38px;
    }
    input::placeholder { color:var(--mute); }
    input:focus, select:focus { outline:none; border-color:var(--accent);
                                box-shadow:0 0 0 3px var(--accent-weak); }
    input[type=search] { min-width:220px; }
    button, .btn { cursor:pointer; display:inline-flex; align-items:center; gap:7px;
                   font-weight:550; }
    button:hover, .btn:hover { border-color:var(--border-strong); text-decoration:none; }
    .btn-primary { background:var(--accent); border-color:var(--accent); color:#08111f;
                   font-weight:650; }
    .btn-primary:hover { background:#63acff; border-color:#63acff; }
    .btn-ghost { background:transparent; }
    .toolbar .right { margin-left:auto; }

    /* ---- key/value -------------------------------------------------------- */
    .kv { display:grid; grid-template-columns:150px 1fr; gap:9px 18px; margin:0; padding:18px; }
    .kv dt { color:var(--mute); font-size:12.5px; }
    .kv dd { margin:0; }

    /* ---- empty state ------------------------------------------------------ */
    .empty { text-align:center; padding:40px 24px; }
    .empty-title { font-weight:600; color:var(--text); margin-bottom:4px; }
    .empty-body { color:var(--dim); max-width:440px; margin:0 auto; }
    td .empty { padding:34px 24px; }

    /* ---- misc ------------------------------------------------------------- */
    .callout { background:var(--surface); border:1px solid var(--border);
               border-left:3px solid var(--accent); border-radius:var(--radius-sm);
               padding:13px 16px; color:var(--dim); margin-bottom:16px; }
    .callout.warn { border-left-color:var(--warn); }
    .logbox { font-family:var(--mono); font-size:12px; line-height:1.5; white-space:pre-wrap;
              background:#0a0e14; color:#c9d4e2; border-radius:var(--radius-sm);
              padding:12px 14px; max-height:220px; overflow:auto; margin-top:12px; }
    .copy { cursor:pointer; color:var(--mute); border:none; background:none; padding:2px 5px;
            height:auto; font-size:12px; border-radius:5px; }
    .copy:hover { color:var(--text); background:var(--surface-2); }
    .num-cell { display:inline-flex; align-items:center; gap:4px; }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand"><span class="dot"></span>Host Tracker</span>
    <nav class="nav">
      <a href="/"          class="{{ 'on' if page == 'dashboard' }}">Overview</a>
      <a href="/accounts"  class="{{ 'on' if page == 'accounts' }}">Accounts</a>
      <a href="/merchants" class="{{ 'on' if page == 'merchants' }}">Merchants</a>
      <a href="/runs"      class="{{ 'on' if page == 'runs' }}">Runs</a>
      <a href="/alerts"    class="{{ 'on' if page == 'alerts' }}">Alerts</a>
    </nav>
    <span class="spacer"></span>
    {% if job and job.is_running %}
      <a class="run-flag" href="/runs"><span class="pulse"></span>Collecting {{ job.current.slug }}…</a>
    {% endif %}
  </header>
  <main>{% block body %}{% endblock %}</main>
  <script>
    // Copy an account number to the clipboard. Vanilla, no library — the page must stay
    // self-contained. Falls back silently where the clipboard API is unavailable.
    function copyText(btn, text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function () {
          var prev = btn.textContent; btn.textContent = "✓";
          setTimeout(function () { btn.textContent = prev; }, 1000);
        });
      }
    }
  </script>
</body>
</html>
