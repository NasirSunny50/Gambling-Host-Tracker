# Melbet Bangladesh. Same platform as 1xbet-bd - the login form, the embedded payment panel
# and the modal markup are the same engine - but every selector here was read off this
# site's own panel while signed in, because "the same engine" is a reason to look, not a
# reason to assume.
#
# Nine of the twelve methods the operator asked for are collected. The three that are not,
# and why, are written against the probe list below.
slug: melbet-bd
name: Melbet Bangladesh
status: active
fetcher: browser

urls:
  # A mirror domain. These rotate; add the next one here rather than editing this line, so
  # the git history keeps which domain was live on which date.
  - url: https://melbet-76956.bar/en/office/recharge
    type: deposit
    current: true

# Behind a login. A run signs in first and writes the session here for the collection that
# follows. No credentials live in this file - they come from .env as
# GHT_LOGIN_MELBET_BD_USERNAME / _PASSWORD.
auth_state: data/auth/melbet-bd.json

# Verified against the live login page on 2026-08-23: the form is the same markup 1xBet
# serves - #username, #username-password, and a "LOG IN" button.
login:
  url: https://melbet-76956.bar/en/user/login
  open: '.auth-dropdown-trigger, .header-auth__enter, text=Log in'
  username: "#username"
  password: "#username-password"
  submit: 'button:has-text("Log in"), .auth-button'
  # Proof we are in: the deposit button only renders for a logged-in user.
  success: '.user-control-dashboard-payment, a[href*="/office/recharge"]'
  challenge:
    - 'iframe[src*="captcha"]'
    - 'iframe[src*="challenge"]'
    - 'text=/verification|captcha|not a robot/i'
  # Assisted, for the same reason as 1xBet: the brand shows a CAPTCHA on sign-in, and that
  # is never worked around - a person clears it in the window the run opens.
  assisted: true

# The payment panel is a separate app embedded in the account page; the flow clicks and the
# block selectors all run inside it. Confirmed on the live panel: same path as the other
# brand.
frame: /paysystems/deposit

# The account page loads its payment panel in an iframe that routinely takes >30s, while a
# click inside it is answered in seconds. Kept apart so a method that has gone away costs
# seconds rather than the whole page budget.
timeout: 90
flow_timeout: 25

# The engine answers a method it has switched off with an information panel carrying
# `modal-payment--method-undefined` where a working one names the method. A run that hits
# it stays healthy and reports which methods were closed.
unavailable:
  - ".modal-payment--method-undefined"

# Between methods, close the open modal instead of reloading the whole panel: the panel
# costs ten to thirteen seconds to start and every method needs the same one. `gone` is the
# proof it worked - a half-closed modal would swallow the next probe's click.
reset:
  click: ".modal-payment__close"
  gone: ".modal-payment.active"

# Verified 2026-08-23: a logged-out request for /en/office/recharge answers 200 and lands on
# /en/user/login?return-url=... , so the URL is the reliable expiry signal here.
logged_out_url: /user/login

# One probe per method. Every selector below was read off the live panel on 2026-08-23,
# not carried over from the other brand: each method prints its receiving wallet in
# `.modal-message-address` inside `.payment_modal_row`, which is the same element 1xBet
# uses for some of its methods and not for others - so it was worth checking.
probes:
  - name: cellfin-free
    flow:
      - click: '.payment-cell[data-method="cellfin_free_bt_8"]'
        wait_for: ".modal-payment.active .modal-message-address"
    wait_for: ".modal-payment.active .modal-message-address"
    blocks:
      - channel: cellfin
        container: ".modal-payment.active .payment_modal_row"
        value: ".modal-message-address"

  - name: nagad
    flow:
      - click: '.payment-cell[data-method="tarak_nagad"]'
        wait_for: ".modal-payment.active .modal-message-address"
    wait_for: ".modal-payment.active .modal-message-address"
    blocks:
      - channel: nagad
        container: ".modal-payment.active .payment_modal_row"
        value: ".modal-message-address"

  - name: rocket
    flow:
      - click: '.payment-cell[data-method="rocket_melbet"]'
        wait_for: ".modal-payment.active .modal-message-address"
    wait_for: ".modal-payment.active .modal-message-address"
    blocks:
      # Rocket publishes twelve digits - the wallet's mobile number with a check digit on
      # the end. The extractor keys it on the mobile and the observation keeps the printed
      # string, so what is stored matches what a payer would be told to send to.
      - channel: rocket
        container: ".modal-payment.active .payment_modal_row"
        value: ".modal-message-address"

  - name: upay
    flow:
      - click: '.payment-cell[data-method="upay_melbet"]'
        wait_for: ".modal-payment.active .modal-message-address"
    wait_for: ".modal-payment.active .modal-message-address"
    blocks:
      - channel: upay
        container: ".modal-payment.active .payment_modal_row"
        value: ".modal-message-address"

  - name: nagad-free
    flow:
      - click: '.payment-cell[data-method="nagad_merchant_bangladesh_melbet"]'
        wait_for: ".modal-payment.active .modal-message-address"
    wait_for: ".modal-payment.active .modal-message-address"
    blocks:
      # This one names the business as well as the number, each in its own copyable
      # element - the only method here that hands over both.
      - channel: nagad
        container: ".modal-payment.active .payment_modal_body"
        value: ".payment_modal_row:nth-of-type(2) .modal-message-address"
        holder: ".payment_modal_row:nth-of-type(3) .modal-message-address"

  - name: trust-axiata-pay
    flow:
      - click: '.payment-cell[data-method="tap_melbet"]'
        wait_for: ".modal-payment.active .modal-message-address"
    wait_for: ".modal-payment.active .modal-message-address"
    blocks:
      - channel: tap
        container: ".modal-payment.active .payment_modal_row"
        value: ".modal-message-address"

  - name: rocket-free
    flow:
      - click: '.payment-cell[data-method="rocket_merchant_melbet"]'
        wait_for: ".modal-payment.active .modal-message-address"
    wait_for: ".modal-payment.active .modal-message-address"
    blocks:
      # Eleven digits here, unlike the Rocket method above: this is the merchant payment
      # number rather than a Rocket wallet.
      - channel: rocket
        container: ".modal-payment.active .payment_modal_row"
        value: ".modal-message-address"

  - name: ipay
    flow:
      - click: '.payment-cell[data-method="ipay_bdt_bt_8"]'
        wait_for: ".modal-payment.active .modal-message-address"
    wait_for: ".modal-payment.active .modal-message-address"
    blocks:
      - channel: ipay
        container: ".modal-payment.active .payment_modal_row"
        value: ".modal-message-address"

  - name: nexus-pay
    flow:
      - click: '.payment-cell[data-method="nexuspay_bt_melbet"]'
        wait_for: ".modal-payment.active .modal-message-address"
    wait_for: ".modal-payment.active .modal-message-address"
    blocks:
      # Nexus Pay is Dutch-Bangla Bank's own wallet, so the thirteen digits are a wallet id
      # rather than a bank account number - but the bank is what an investigator needs, and
      # the page never writes it beside the number.
      - channel: bank_transfer
        container: ".modal-payment.active .payment_modal_row"
        value: ".modal-message-address"
        bank_name: "Dutch-Bangla Bank"

# Still to add, both blocked on a live check the site kept cutting short:
#
#   cellfin_bt_melbet (Bank transfer > Cellfin) - the cell would not open on the shared
#     panel and no modal appeared. Needs a visit of its own to see whether it is switched
#     off, in a section that has to be opened first, or simply slower than the others.
#
#   melbet_bt_bangla (Bank transfer) - the modal opens with a bank dropdown and nothing
#     else. `select[name="bank"]` offered exactly, on 2026-08-23:
#       "Select recipient's bank" | "1.UCB Bank" | "2. Pubali Bank." | "DUTCH BANGLA BANK,"
#       | "Islami Bank"
#     Those labels are the site's own wording, numbering and stray punctuation included,
#     and have to be copied exactly. One probe per bank, each with bank_name set from the
#     option. What the modal shows once a bank is chosen has not been seen yet - there is a
#     #btn_next button in it, which may or may not be needed before the details appear.
#
#   nagad_melbet_p2c (Nagad by Paykassma) - same non-opening cell as cellfin_bt. Its flow
#     is known from the operator: type 200 into the amount, press Next, and the payee is
#     the merchant name on the Nagad checkout the browser lands on. Confirming a deposit is
#     what gets there, so this probe raises a real - unpaid - deposit request every run and
#     must carry `creates_order: true`.

ignore_numbers: []

notes: |
  2026-08-23, recon part one (logged out, headless).

  Reachable and not behind Cloudflare: /en/office/recharge answers 200 to a plain Chromium
  and redirects to /en/user/login?return-url=%252Fen%252Foffice%252Frecharge, so the
  session-expiry signal is the URL rather than a body marker. Page title "Melbet".

  The login page is the 1xBet engine's: #username, #username-password, a "LOG IN" button
  with class ui-button--theme-accent, and a "Forgot your password?" inline button. Three
  radio tabs (auth_tabs) switch between sign-in methods; the default one holds the fields
  above. A support widget iframe (widget.suphelper.top) sits on the page and is unrelated.

  Still to confirm with a session, because none of it renders logged out:
    - the payment panel's iframe path (expected /paysystems/deposit)
    - the `data-method` id behind each method cell, per the operator's list
    - which modal element carries the payee for each method: 1xBet splits between
      `.payment_modal_input--html` and `.modal-message-address`, and it differs per method
    - the Bank Transfer dropdown's option labels, which are the site's own wording and
      drift - a mismatch has to fail fast and name the current options
