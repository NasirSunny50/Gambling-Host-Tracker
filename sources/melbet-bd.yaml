# Melbet Bangladesh. Same platform as 1xbet-bd - the login form, the embedded payment panel
# and the modal markup are the same engine - but every selector here was read off this
# site's own panel while signed in, because "the same engine" is a reason to look, not a
# reason to assume.
#
# Nine of the twelve methods the operator asked for are collected. The three that are not,
# and why, are written against the probe list below.
slug: melbet-bd
name: Melbet Bangladesh
status: active
fetcher: browser

urls:
  # A mirror domain. These rotate; add the next one here rather than editing this line, so
  # the git history keeps which domain was live on which date.
  - url: https://melbet-76956.bar/en/office/recharge
    type: deposit
    current: true

# Behind a login. A run signs in first and writes the session here for the collection that
# follows. No credentials live in this file - they come from .env as
# GHT_LOGIN_MELBET_BD_USERNAME / _PASSWORD.
auth_state: data/auth/melbet-bd.json

# Same engine as 1xBet, and the same login-selector fix applies (verified live 2026-08-25:
# headless sign-in succeeds, no CAPTCHA, no window). The form renders on /user/login on its
# own - slower here, the mirror lags - so no "open" click; `input#` targets the real input
# past the duplicate-id wrapper div; the submit is the accent full-width button, not the
# header dropdown-trigger that also says "Log in".
login:
  url: https://melbet-76956.bar/en/user/login
  username: "input#username"
  password: "input#username-password"
  submit: ".auth-form-fields__submit, .ui-button--theme-accent.ui-button--block"
  # Proof we are in. Every member of this list has to be absent when logged out, because
  # `success` is matched as one comma list and any one member satisfies it - so a single
  # bad member declares victory on the login page itself.
  #
  # `.user-control-dashboard-payment` was that bad member. It is rendered on 1xBet's own
  # logged-out login page, so the unattended sign-in reported success the instant it
  # clicked submit, navigated straight to the deposit page while the login POST was still
  # in flight, and cut it off - then reported "the sign-in did not take". The sign-in was
  # fine; the proof was wrong. Melbet renders that element only when signed in, which is
  # why the same config could sign itself in there and not here.
  #
  # Both of these were measured logged-out and logged-in on both brands, 2026-08-30:
  # absent before, present after.
  success: 'a[href*="/office/recharge"], a[href*="/office/account"]'
  # Widgets, not words - kept identical to the other brand, which runs the same engine.
  # See the 1xBet config for why a text match on "verification" was wrong.
  challenge:
    - 'iframe[src*="captcha"]'
    - 'iframe[src*="challenge"]'
    - 'iframe[src*="recaptcha"]'
    - 'iframe[src*="hcaptcha"]'
    - 'iframe[src*="turnstile"]'
    - 'iframe[title*="captcha" i]'
    - '.g-recaptcha'
    - '.h-captcha'
    - '.cf-turnstile'
    - '#captcha'
    - '[data-sitekey]'
  # Kept as a safety net only: with the selectors above the unattended sign-in succeeds, so
  # the window stays shut. It opens solely if the site ever does answer with a real CAPTCHA.
  assisted: true

# The payment panel is a separate app embedded in the account page; the flow clicks and the
# block selectors all run inside it. Confirmed on the live panel: same path as the other
# brand.
frame: /paysystems/deposit

# The account page loads its payment panel in an iframe that routinely takes >30s, while a
# click inside it is answered in seconds. Kept apart so a method that has gone away costs
# seconds rather than the whole page budget.
timeout: 90
flow_timeout: 25

# The engine answers a method it has switched off with an information panel carrying
# `modal-payment--method-undefined` where a working one names the method. A run that hits
# it stays healthy and reports which methods were closed.
unavailable:
  - ".modal-payment--method-undefined"

# Between methods, close the open modal instead of reloading the whole panel: the panel
# costs ten to thirteen seconds to start and every method needs the same one. `gone` is the
# proof it worked - a half-closed modal would swallow the next probe's click.
reset:
  click: ".modal-payment__close"
  gone: ".modal-payment.active"

# What to photograph. The deposit page runs to thousands of pixels of lobby around one
# small panel, and the panel is the payee. Where a probe ends up somewhere without one -
# a provider's own checkout - this finds nothing and the whole page is captured instead.
shot: ".modal-payment.active"

# The panel refuses an expired session with its own dialog, drawn on the page rather than
# inside the frame: the method list still renders behind it and every click lands on the
# dialog. The URL signal below cannot see that - the site keeps serving the signed-in shell
# and never redirects - so without this a dead session reads as every selector breaking at
# once. Matched on the dialog being *visible*, because its markup is in the page either
# way. Seeing it ends the run and sends it back to sign in.
session_expired:
  - 'text="The session has expired"'

# Verified 2026-08-23: a logged-out request for /en/office/recharge answers 200 and lands on
# /en/user/login?return-url=... , so the URL is the reliable expiry signal here.
logged_out_url: /user/login

# One probe per method. Every selector below was read off the live panel on 2026-08-23,
# not carried over from the other brand: each method prints its receiving wallet in
# `.modal-message-address` inside `.payment_modal_row`, which is the same element 1xBet
# uses for some of its methods and not for others - so it was worth checking.
probes:
  - name: cellfin-free
    flow:
      - click: '.payment-cell[data-method="cellfin_free_bt_8"]'
        wait_for: ".modal-payment.active .modal-message-address"
    wait_for: ".modal-payment.active .modal-message-address"
    blocks:
      - channel: cellfin
        container: ".modal-payment.active .payment_modal_row"
        value: ".modal-message-address"

  - name: nagad
    flow:
      - click: '.payment-cell[data-method="tarak_nagad"]'
        wait_for: ".modal-payment.active .modal-message-address"
    wait_for: ".modal-payment.active .modal-message-address"
    blocks:
      - channel: nagad
        container: ".modal-payment.active .payment_modal_row"
        value: ".modal-message-address"

  - name: rocket
    flow:
      - click: '.payment-cell[data-method="rocket_melbet"]'
        wait_for: ".modal-payment.active .modal-message-address"
    wait_for: ".modal-payment.active .modal-message-address"
    blocks:
      # Rocket publishes twelve digits - the wallet's mobile number with a check digit on
      # the end. The extractor keys it on the mobile and the observation keeps the printed
      # string, so what is stored matches what a payer would be told to send to.
      - channel: rocket
        container: ".modal-payment.active .payment_modal_row"
        value: ".modal-message-address"

  - name: upay
    flow:
      - click: '.payment-cell[data-method="upay_melbet"]'
        wait_for: ".modal-payment.active .modal-message-address"
    wait_for: ".modal-payment.active .modal-message-address"
    blocks:
      - channel: upay
        container: ".modal-payment.active .payment_modal_row"
        value: ".modal-message-address"

  - name: nagad-free
    flow:
      - click: '.payment-cell[data-method="nagad_merchant_bangladesh_melbet"]'
        wait_for: ".modal-payment.active .modal-message-address"
    wait_for: ".modal-payment.active .modal-message-address"
    blocks:
      # This one names the business as well as the number, each in its own copyable
      # element - the only method here that hands over both.
      - channel: nagad
        container: ".modal-payment.active .payment_modal_body"
        value: ".payment_modal_row:nth-of-type(2) .modal-message-address"
        holder: ".payment_modal_row:nth-of-type(3) .modal-message-address"

  - name: trust-axiata-pay
    flow:
      - click: '.payment-cell[data-method="tap_melbet"]'
        wait_for: ".modal-payment.active .modal-message-address"
    wait_for: ".modal-payment.active .modal-message-address"
    blocks:
      - channel: tap
        container: ".modal-payment.active .payment_modal_row"
        value: ".modal-message-address"

  - name: rocket-free
    flow:
      - click: '.payment-cell[data-method="rocket_merchant_melbet"]'
        wait_for: ".modal-payment.active .modal-message-address"
    wait_for: ".modal-payment.active .modal-message-address"
    blocks:
      # Eleven digits here, unlike the Rocket method above: this is the merchant payment
      # number rather than a Rocket wallet.
      - channel: rocket
        container: ".modal-payment.active .payment_modal_row"
        value: ".modal-message-address"

  - name: ipay
    flow:
      - click: '.payment-cell[data-method="ipay_bdt_bt_8"]'
        wait_for: ".modal-payment.active .modal-message-address"
    wait_for: ".modal-payment.active .modal-message-address"
    blocks:
      - channel: ipay
        container: ".modal-payment.active .payment_modal_row"
        value: ".modal-message-address"

  - name: nexus-pay
    flow:
      - click: '.payment-cell[data-method="nexuspay_bt_melbet"]'
        wait_for: ".modal-payment.active .modal-message-address"
    wait_for: ".modal-payment.active .modal-message-address"
    blocks:
      # Nexus Pay is Dutch-Bangla Bank's own wallet, so the thirteen digits are a wallet id
      # rather than a bank account number - but the bank is what an investigator needs, and
      # the page never writes it beside the number.
      - channel: bank_transfer
        container: ".modal-payment.active .payment_modal_row"
        value: ".modal-message-address"
        bank_name: "Dutch-Bangla Bank"

  # Nagad by Paykassma. This one has to be paid for to be read: the payee only exists once
  # a deposit request has been raised, so every run of this probe raises one - a real
  # request on the operator, for 200 BDT, which is never paid and cannot be, because
  # nothing is ever sent. That is what `creates_order` marks, and the portal names it
  # before a run.
  #
  # What it yields is a name, not a wallet. The checkout asks the payer for *their* Nagad
  # number and shows only the business collecting - so there is no receiving account to
  # store, and the name rotates between requests. That pool of names is the intelligence.
  #
  # Three documents deep: the method cell lives in the deposit panel, the amount form in
  # paykassma's own iframe nested inside it, and pressing Next takes the whole tab to
  # Nagad's checkout. Hence the `frame:` on the second step - without it the selectors run
  # against the panel, match nothing, and report a stale config.
  #
  # 200 is the site's own minimum for this method ("more than 200"), so it is the smallest
  # request that can be raised to see the name.
  - name: nagad-paykassma
    channel: nagad
    creates_order: true
    flow:
      - click: '.payment-cell[data-method="nagad_melbet_p2c"]'
      - frame: plugin.pay-melbet2.com
        fill: 'input[name="amount"]'
        value: "200"
        wait_for: 'button:has-text("Next")'
      - click: 'button:has-text("Next")'
    wait_for: ".merchant-name"
    merchant: ".merchant-name"

# Not collected, and why:
#
#   cellfin_bt_melbet (Bank transfer > Cellfin) - the site withdrew it partway through this
#     recon. It was in the list at 12:10 and gone by 13:00, with the method count dropping
#     from 72 to 71 and the Bank transfer section down to one entry. A probe for a method
#     that is not on the page can only time out and report itself as broken, so it is left
#     out rather than left to cry wolf; the id above is what to search for if it returns.

discover:
  # Every E-wallets cell that is a bKash / Nagad / Upay under any name. Scoped to the
  # E-wallets section so the Recommended duplicates, the card systems and the crypto list
  # are left alone.
  #
  # This is how Bkash Free is collected: the section carries `bkash_merchant_melbet`
  # ("Bkash Free") and there has never been a bKash probe here, so the site's whole bKash
  # side went uncollected while the fixed list only ever saw the methods someone had
  # written down. Nagad and Upay overlap with the probes above on purpose - the same
  # de-duplication that handles one account seen twice handles this, and the point of a
  # discovery is that the *next* "Super Bkash" or "The Local Nagad" is collected without a
  # config edit.
  #
  # Only the modal is opened, never a confirm, so this can never raise a deposit request -
  # including on Nagad by Paykassma, whose cell the nagad match also opens. That one shows
  # a redirect form and no number, so it yields nothing here; its name still comes from the
  # explicit `nagad-paykassma` probe, which is the only thing that pays for it.
  - name: e-wallet
    kind: cells
    items: '.section-block:has(.section_name_title:has-text("E-wallets")) .payment-cell'
    label: ".payment-cell-name__caption--is-title"
    # The panel's frame appears seconds before its cells do; wait for any cell first.
    ready: ".payment-cell"
    match: [bkash, nagad, upay]
    # Nagad by Paykassma is left alone. Its cell matches "nagad", but it reaches its payee
    # by taking the whole tab to the provider's checkout - so it shows no number here, and
    # the panel it navigates away from has to be rebuilt before the next cell can be
    # clicked. Live 2026-08-25 that reload did not come back, and the walk stopped there
    # with uPay, Nagad Free and Bkash Free never opened. Its name is collected by the
    # explicit `nagad-paykassma` probe, which is the only thing that pays for it.
    skip_keys: [nagad_melbet_p2c]
    wait_for: ".modal-payment.active"
    container: ".modal-payment.active"
    value: ".modal-payment.active .payment_modal_input--html, .modal-payment.active .modal-message-address"

  # Bank Transfer, walked one recipient bank at a time. This replaces four probes that
  # named their options verbatim ("1.UCB Bank", "2. Pubali Bank.", "DUTCH BANGLA BANK,");
  # the site re-labelled the dropdown and three of the four stopped matching, so three
  # banks went uncollected and reported themselves as a stale config every run - which they
  # were. Reading the options off the page instead means a re-labelled, added or dropped
  # bank is picked up on the next fetch rather than by hand.
  #
  # Live 2026-08-25 the dropdown offered seven: City Bank, DBBL Bank, EBL Bank, Islami
  # Bank, Premier Bank, Pubali Bank, UCB Bank. Choosing one fills the modal in place with
  # that bank's account - no confirm, so no order. The account sits in the 2nd modal row
  # and the holder in the 4th (1xBet uses the 3rd; this brand does not).
  - name: bank
    kind: options
    channel: bank_transfer
    ready: ".payment-cell"
    open:
      - click: '.payment-cell[data-method="melbet_bt_bangla"]'
        wait_for: '.modal-payment.active select[name="bank"]'
    items: '.modal-payment.active select[name="bank"]'
    skip_options: ["0", "Select recipient's bank"]
    wait_for: ".modal-payment.active .payment_modal_row:nth-of-type(2) .modal-message-address"
    container: ".modal-payment.active"
    value: ".payment_modal_row:nth-of-type(2) .modal-message-address"
    holder: ".payment_modal_row:nth-of-type(4) .modal-message-address"

ignore_numbers: []

notes: |
  2026-08-23, recon part one (logged out, headless).

  Reachable and not behind Cloudflare: /en/office/recharge answers 200 to a plain Chromium
  and redirects to /en/user/login?return-url=%252Fen%252Foffice%252Frecharge, so the
  session-expiry signal is the URL rather than a body marker. Page title "Melbet".

  The login page is the 1xBet engine's: #username, #username-password, a "LOG IN" button
  with class ui-button--theme-accent, and a "Forgot your password?" inline button. Three
  radio tabs (auth_tabs) switch between sign-in methods; the default one holds the fields
  above. A support widget iframe (widget.suphelper.top) sits on the page and is unrelated.

  Still to confirm with a session, because none of it renders logged out:
    - the payment panel's iframe path (expected /paysystems/deposit)
    - the `data-method` id behind each method cell, per the operator's list
    - which modal element carries the payee for each method: 1xBet splits between
      `.payment_modal_input--html` and `.modal-message-address`, and it differs per method
    - the Bank Transfer dropdown's option labels, which are the site's own wording and
      drift - a mismatch has to fail fast and name the current options

  2026-08-25 live recon (session valid, no CAPTCHA). Two things the fixed probe list was
  missing, both now discoveries:

    - The Bank Transfer dropdown offers SEVEN banks - City Bank, DBBL Bank, EBL Bank,
      Islami Bank, Premier Bank, Pubali Bank, UCB Bank - and the site had re-labelled every
      one of them. The four hardcoded probes matched their old wording ("1.UCB Bank",
      "2. Pubali Bank.", "DUTCH BANGLA BANK,"), so three failed every fetch and reported a
      stale config, which was exactly right, and the three banks behind them went
      uncollected. Replaced by `discover: bank` (kind: options), which reads the labels off
      the page. The failure mode was doing its job - it named the problem for two days
      before anyone read it.

    - The E-wallets section carries `bkash_merchant_melbet` ("Bkash Free") and there was no
      bKash probe at all, so this brand's bKash side was never collected. `discover:
      e-wallet` now walks every E-wallets cell whose name carries bkash / nagad / upay.
      Section markup is identical to 1xBet's - `.section-block` > `.section_name_title`,
      cells named by `.payment-cell-name__caption--is-title` - confirmed against a captured
      panel, so the other brand's selectors transfer as they are.

  E-wallets cells as at 2026-08-25: Cellfin Free, Nagad, Rocket, Nagad by Paykassma, uPay,
  Nagad Free, Trust Axiata Pay, Rocket Free, Bkash Free, iPay, then the non-BD wallets
  (WebMoney, MiFinity, Skrill, MoneyGO, BinancePay, BybitPay, KuCoin, Bitget).

  Verified live 2026-08-25 (run 255, walked without the paykassma probe so it cost no
  deposit request). All seven banks came back with distinct accounts - City Bank, DBBL,
  EBL, Islami, Premier, Pubali, UCB - and `e-wallet-bkash-free` returned this brand's first
  bKash account. The e-wallet walk also covered Nagad, Nagad Free and uPay.

  The run before it (254) is why `skip_keys` exists: the discovery opened Nagad by
  Paykassma, which took the tab to the provider's checkout, and the panel never came back.
  uPay, Nagad Free and Bkash Free were never opened and the bank discovery never got a
  panel at all - and the fetch still reported "ok", because a walk cut short said nothing.
  Both silences are now failures the fetch is blamed for.

  `rocket-free` failed to read in run 255 and has never failed before or since - checked
  against every Melbet fetch in the database, it returned its twelve-digit number on all of
  them, including run 254 twelve minutes earlier. The stored page settles it: run 254's
  capture holds `.modal-message-address` = 016200871510 inside an open modal; run 255's
  capture has no `.modal-payment.active` at all. The modal never opened that once, so this
  is not a drifted selector and there is nothing to change here. If it starts recurring,
  look at the reset between probes (the probe before it is trust-axiata-pay, which
  succeeded), not at the selector.

