# Verified end to end against a live logged-in session on 2026-08-18.
slug: 1xbet-bd
name: 1xBet Bangladesh
status: active
fetcher: browser

urls:
  # Not the homepage: the deposit UI is behind the green header button.
  - url: https://bd.1xbet.com/en/office/recharge
    type: deposit
    current: true

# Behind a login. A run signs in first, using the login block below, and writes the
# session here for the collection that follows.
auth_state: data/auth/1xbet-bd.json

# Sign-in. Selectors are from the observed login form; verify against a live page if the
# site redesigns. Because 1xBet shows a CAPTCHA, this is assisted (see below): a run that
# finds the session expired opens a visible browser for the operator to sign in.
login:
  # The account page redirects here when the session is dead.
  url: https://bd.1xbet.com/en/user/login
  # The header "Log in" opens the auth form before the fields exist (harmless if already
  # on the login page — a missing element is ignored in assisted mode).
  open: '.header-auth__enter, [class*="auth"] button, text=Log in'
  username: "#username"
  password: "#username-password"
  submit: 'button:has-text("Log in"), .auth-button'
  # Proof we are in: the deposit button only renders for a logged-in user.
  success: '.user-control-dashboard-payment, a[href*="/office/recharge"]'
  challenge:
    - 'iframe[src*="captcha"]'
    - 'iframe[src*="challenge"]'
    - 'text=/verification|captcha|not a robot/i'
  # 1xBet shows a CAPTCHA on login that cannot be solved automatically, so open a visible
  # browser and let the operator sign in by hand: they solve the CAPTCHA and press the
  # site's Log in button, then collection continues. Needs a desktop — a headless server
  # cannot show this window.
  assisted: true

# The payment panel is a separate app embedded in the account page. The flow clicks and
# the block selectors all run inside this frame; from the outer document they match nothing.
frame: /paysystems/deposit

# The account page loads its payment panel in an iframe that routinely takes >30s.
timeout: 90
# A click, though, is answered in seconds. Kept separate so a method that has gone away
# costs seconds rather than the whole page budget - eight probes at 90s each was most of
# an eight-minute run spent waiting for buttons that were never coming.
flow_timeout: 25

# 1xBet switches individual methods off and answers the click with an information panel
# instead of the payee. The modal names the method it opened for, and names it "undefined"
# when there is nothing to open - that is the site telling us plainly, so a run that hits
# it stays healthy and simply reports which methods were closed.
unavailable:
  - ".modal-payment--method-undefined"

# Between methods, close the open modal instead of reloading the whole panel. The panel
# takes ten to thirteen seconds to start and every method needs the same one; closing the
# modal is under a second. `gone` is the proof it worked - if the modal is still there the
# run reloads rather than clicking the next method through it.
reset:
  click: ".modal-payment__close"
  gone: ".modal-payment.active"

# What to photograph. The deposit page runs to thousands of pixels of lobby around one
# small panel, and the panel is the payee. Where a probe ends up somewhere without one -
# a provider's own checkout - this finds nothing and the whole page is captured instead.
shot: ".modal-payment.active"

# The panel refuses an expired session with its own dialog, drawn on the page rather than
# inside the frame: the method list still renders behind it and every click lands on the
# dialog. Nothing else here can see that - the site keeps serving the signed-in shell and
# the URL never changes - so without this a dead session reads as every selector breaking
# at once. Matched on the dialog being *visible*, because its markup is in the page either
# way. Seeing it ends the run and sends it back to sign in.
session_expired:
  - 'text="The session has expired"'

# Present only when signed out; its appearance means the session must be refreshed.
logged_out_marker: registration-layout-widget
# A dead session redirects the account page to /en/user/login.
logged_out_url: /user/login

# The in-modal e-wallets (Bkash, Upay, Bkash Free, Upay Free, The Local Nagad, and any new
# module the operator spins up under one of those names) are no longer named one by one.
# They are found by `discover` below, which walks the E-wallets section and reads every cell
# whose name carries a channel word - so a rename or an addition is collected without a
# config edit, which is exactly what these operators keep doing. Only the two methods a
# discovery cannot handle stay explicit probes: Internet Banking, whose name carries no
# channel word, and the two paykassma redirects, whose payee is a name reached only by
# confirming a deposit (which a discovery never does).
probes:
  # Internet Banking. The panel is Nexus Pay - Dutch-Bangla Bank's own wallet - so the
  # number is a wallet id and the bank is named here rather than read off the page.
  - name: nexus-pay
    flow:
      - click: '.payment-cell[data-method="internet_banking"]'
        wait_for: ".payment_modal_input--html"
    wait_for: ".payment_modal_input--html"
    blocks:
      - channel: bank_transfer
        container: ".payment_modal_body"
        value: ".modal-message-address"
        bank_name: "Dutch-Bangla Bank"

  # paykassma2. Confirming REDIRECTS out to Nagad's own checkout, which names a merchant
  # but never shows a receiving wallet - so this records a name, not an account. Walking it
  # raises a real (unpaid) deposit order every run; that is the price of the name.
  - name: fast-nagad
    channel: nagad
    creates_order: true
    flow:
      - click: '.payment-cell[data-method="nagad_b_webdef"]'
        wait_for: "#deposit_button"
      # No wait_for here: this click navigates out of the iframe entirely, so waiting for
      # an element of the destination page from inside the frame always times out and
      # reports a break that did not happen. The probe-level wait below does it properly,
      # against whatever document we actually land on.
      - click: "#deposit_button"
    wait_for: ".merchant-name"
    merchant: ".merchant-name"

  # LightSpeed Bkash is the other paykassma2 redirect, the bKash twin of Fast Nagad. Same
  # shape: open the modal, confirm, land on the provider's checkout that names a merchant.
  # Same cost, too - a real deposit order per walk - so it is creates_order and only runs
  # when the operator has agreed to it. The destination selector is modelled on Fast Nagad
  # and wants a live check the first time it runs.
  - name: lightspeed-bkash
    channel: bkash
    creates_order: true
    flow:
      - click: '.payment-cell[data-method="bkash_p2p_webdef"]'
        wait_for: "#deposit_button"
      - click: "#deposit_button"
    wait_for: ".merchant-name"
    merchant: ".merchant-name"

# Found and walked at run time rather than named. See the block comment on `probes`.
discover:
  # Every E-wallets cell that is a bKash / Nagad / Upay under any name. Scoped to the
  # E-wallets section so the recommended duplicates and the crypto list are left alone. The
  # channel is read from whichever word the name carries. Opening the modal is all this
  # does - the paykassma redirects (Fast Nagad, LightSpeed Bkash) show no number here and
  # yield nothing, which is right: their names come from the explicit probes above.
  - name: e-wallet
    kind: cells
    items: '.section-block:has(.section_name_title:has-text("E-wallets")) .payment-cell'
    label: ".payment-cell-name__caption--is-title"
    match: [bkash, nagad, upay]
    wait_for: ".modal-payment.active .payment_modal_input--html, .modal-payment.active .modal-message-address"
    container: ".modal-payment.active"
    value: ".modal-payment.active .payment_modal_input--html, .modal-payment.active .modal-message-address"

  # Bank Transfer no longer offers a recipient-bank dropdown - it opens straight to a single
  # account, the way Internet Banking does. So it is walked as a cell rather than by
  # iterating options: every cell in the Bank transfer section is opened and its account
  # read, under a fixed bank_transfer channel (the section's names carry no channel word to
  # infer from). If the method is switched off, or gone from the list entirely, this simply
  # finds no cell and yields nothing.
  - name: bank-transfer
    kind: cells
    items: '.section-block:has(.section_name_title:has-text("Bank transfer")) .payment-cell'
    label: ".payment-cell-name__caption--is-title"
    channel: bank_transfer
    wait_for: ".modal-payment.active .payment_modal_input--html, .modal-payment.active .modal-message-address"
    container: ".modal-payment.active"
    value: ".modal-payment.active .payment_modal_input--html, .modal-payment.active .modal-message-address"

ignore_numbers: []

notes: |
  Live recon 2026-08-18, bank list re-checked 2026-08-20.

  Structure: /en/office/recharge embeds an iframe at bd.1xbet.com/paysystems/deposit/
  carrying an h_token JWT that expires in ~4h, so the frame has to be reached through the
  account page rather than by saving its URL. 67 methods, 10 marked recommended:

      Fast Nagad          nagad_b_webdef         paykassma2
      LightSpeed Bkash    bkash_p2p_webdef       paykassma2
      Bkash               bt_bangladesh_default  bt3
      Upay                upay_bangla            bt3
      Bkash Free          bkash_free             bt3
      Internet Banking    internet_banking       bt3
      Bank Transfer       bt_bangla              bt3
      Tether on Tron      usdttrx                cryptocurrencies2
      TRON                tron                   cryptocurrencies2

  The two aggregators expose completely different things, which is why only bt3 is
  configured here:

  bt3 - the receiver is printed in the modal as "<01XXXXXXXXX> <business name>". A number we can
  store, dedup and alert on. This is the collectable case.

  paykassma2 - pressing Confirm raises a deposit order and redirects out through
  dazen1.one/pay/bn to Nagad's own checkout at payment.mynagad.com:30000. That page shows
  a merchant name, an invoice id and an amount, and asks for the PAYER's number. No
  receiver wallet number exists to collect. The merchant name also rotates per request -
  observed as RIYA FASHION and LADIES AND BABY SHOP minutes apart - so it identifies a
  paykassma merchant account, not a stable payee.

  Consequences worth deciding on before this leaves draft:
    - a paykassma2 payee cannot be represented by the current model, which keys an account
      on (channel, account_number). Storing it needs a name-only observation type.
    - walking a paykassma2 method raises a real deposit order each run. Any scheduled
      collection must stay on the bt3 methods.
    - the business name sits as a bare text node beside the number rather than in its own
      element, so `holder` cannot select it and holder_name comes back empty.

  2026-08-21 recon (live, logged in). 63 method cells on the page, and the picture had
  changed again:

    - `bt_bangla` (Bank Transfer) is GONE from the list entirely, taking its bank dropdown
      with it. The three bt-* probes that walked that dropdown are removed here rather than
      left to time out; the git history holds them if the method comes back.
    - `bt_bangladesh_default` (Bkash), `upay_bangla` and `bkash_free` are still listed, but
      clicking them returns "This method is not available due to technical issues". The
      modal carries `modal-payment--method-undefined` where a working one carries
      `modal-payment--method-<name>`, which is what `unavailable:` above matches. This is
      intermittent - upay collected normally 20 minutes before the recon - so the probes
      stay and the run reports them as closed rather than broken.
    - `internet_banking` works. Its modal is Nexus Pay ("নেক্সাস পে ওয়ালেট নাম্বার" plus a
      13-digit wallet id), which is Dutch-Bangla Bank's own wallet - so `bank_name` below
      is right, though the number is a wallet id rather than a bank account number.
    - `fast-nagad` works, and still yields a rotating merchant name rather than an account.

  2026-08-20: the site changed under us, which is what the partial run was reporting.
  `pubali_bank_bdt` is gone entirely, and the Bank Transfer dropdown now offers
  Dutch-Bangla Bank Limited / IFIC / Islami Bank Bangladesh Limited in place of
  AB Bank / DBBL BANK / EBL BANK / Premier Bank. Those option labels are the site's own
  wording and will drift again; a mismatch now fails fast and names the current options.

  2026-08-24: reworked from a fixed probe list to discovery, off the captured method grid
  of run 182. The panel groups its cells under section headers (Recommended, E-wallets,
  Internet banking, Bank transfer, Cryptocurrency), each an unlabelled `.section-block`
  whose only handle is its `.section_name_title` text - hence the `:has-text(...)` scoping.
  The E-wallets section then held: Fast Nagad, LightSpeed Bkash (both paykassma2), The
  Local Nagad (wallet_nagad_bdt_1_new, interkassa2), Bkash, Upay, Bkash Free (bt3), AIRTM,
  Upay Free (upay_free_bdt, bt3), MoneyGo, BinancePay.

  Why discovery: the operator keeps adding e-wallet modules under new ids but familiar
  names, and a fixed list only ever sees yesterday's. `discover: e-wallet` walks every
  E-wallets cell whose name carries bkash / nagad / upay and reads its modal, so Upay Free
  and The Local Nagad are collected without being named, and the next new "<brand> X" is
  too. Extraction of the bt3 modal was checked offline against run 182's captured Bkash
  panel (number in `.payment_modal_input--html`, sometimes `.modal-message-address`).

  Still wants a live check the first time it runs (all modelled, none seen live yet):
    - `discover: bank-transfer` — Bank Transfer no longer has the recipient-bank dropdown
      the earlier recon saw; the operator confirms it now opens straight to one account, so
      it is walked as a cell, not by iterating a `<select>`. The value selector is the same
      bt3 pair the e-wallets use; confirm the account actually renders there.
    - `lightspeed-bkash` — its redirect destination selector is copied from `fast-nagad`.
      creates_order, so it only runs when the operator agrees.
    - The Local Nagad (interkassa2) — never walked before; its modal may print a number or
      may redirect. If it redirects it simply yields nothing here, which is safe.
